name: joli_crm
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  dio: any
  flutter_bloc: any
  retrofit: any
  flutter_secure_storage: any
  shared_preferences: any
  json_annotation: ^4.12.0
  dartz: any
  get_it: any
  package_info_plus: any
  easy_localization: any
  form_validator: any
  flutter_screenutil: any
  flutter_svg: any
  lottie: any
  pinput: any
  dart_jsonwebtoken: any
  skeletonizer: ^2.1.3
  flutter_slidable: ^4.0.3
  alert_info: ^0.0.8
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  image_picker: ^1.2.2
  cached_network_image: ^3.4.1
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4
  context_menu_android: ^1.2.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/new_logo.png"
  min_sdk_android: 21

dev_dependencies:
  flutter_test:
    sdk: flutter

  retrofit_generator: any
  build_runner: any
  json_serializable: any

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translation/
    - assets/images/
    - assets/svgs/
    - assets/lottie/

